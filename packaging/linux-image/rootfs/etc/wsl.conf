# Slate Operations Linux image (docs/plans/windows-installer.md 3.1 and 3.2, W4-3).
# systemd runs Docker Engine. Linux never starts a Windows program and reads no Windows
# drive: interop is off, the Windows PATH is not added, and drives are not mounted.
# The engine mounts only the backup target, when it needs it (plan 3.2 rule 4).
[boot]
systemd=true

[user]
default=root

[interop]
enabled=false
appendWindowsPath=false

[automount]
enabled=false
