# Slate Operations Linux image (docs/plans/windows-installer.md W4-6, 10.7 clock row).
# Time comes only from NTS-authenticated servers. chronyd listens on no port:
# "port 0" turns off the NTP server, "cmdport 0" turns off the UDP command port
# (chronyc still works as root through the Unix socket in /run/chrony).
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
port 0
cmdport 0

ntsdumpdir /var/lib/chrony
driftfile /var/lib/chrony/chrony.drift
# Step the clock in the first three updates if it is wrong by more than 1 second
# (a WSL VM can resume with a stale clock).
makestep 1 3
maxupdateskew 100.0

# The offset of each clock update goes to /var/log/chrony/tracking.log; Debian's
# logrotate rule for chrony caps the folder. A change over 0.5 s also goes to the journal.
logdir /var/log/chrony
log tracking
logchange 0.5
