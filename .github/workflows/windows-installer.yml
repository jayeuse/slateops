name: Windows installer

# docs/plans/windows-installer.md W7: compile the Inno Setup project and run the tests of the
# Windows-side scripts in Windows PowerShell 5.1. GitHub's Windows runners have no nested
# virtualization, so nothing here starts WSL; the owner's install (W14) proves those parts.

on:
  pull_request:
    paths:
      - "infra/windows/installer/**"
      - ".github/workflows/windows-installer.yml"
      # The engine wire contract that the Windows side follows (P3-8).
      - "packaging/engine/receive.py"
      - "packaging/engine/status.py"
      - "packaging/engine/log_bundle.py"
      - "packaging/engine/release.py"
  push:
    branches: [main]
    paths:
      - "infra/windows/installer/**"
      - ".github/workflows/windows-installer.yml"
      # The engine wire contract that the Windows side follows (P3-8).
      - "packaging/engine/receive.py"
      - "packaging/engine/status.py"
      - "packaging/engine/log_bundle.py"
      - "packaging/engine/release.py"

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the pinned Inno Setup and compile the setup project
        shell: powershell
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
          INNO_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $installer -UseBasicParsing
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup SHA-256 $hash does not match the pin." }
          $dir = Join-Path $env:RUNNER_TEMP 'innosetup'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$dir`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "The Inno Setup install ended with exit code $($process.ExitCode)." }
          Set-Location infra\windows\installer
          # W9: the small maintenance program first, then the setup program that carries it, so
          # every [Code] branch but the payload compiles here.
          & (Join-Path $dir 'ISCC.exe') /Qp /DAppVersion=0.0.0 /DSettingsBuild SlateOpsSetup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $settings = (Resolve-Path 'output\SlateOpsSettings.exe').Path
          & (Join-Path $dir 'ISCC.exe') /Qp /DAppVersion=0.0.0 "/DSettingsExe=$settings" SlateOpsSetup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -LiteralPath output | Format-Table -AutoSize Name, Length
      - name: Run the setup program's [Code] self-test (W14-D1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location infra\windows\installer
          $iscc = Join-Path $env:RUNNER_TEMP 'innosetup\ISCC.exe'
          # TASK-0097: each build runs hidden, writes one result file and installs nothing. The
          # red build adds the W14-D1 pattern (an "array of String" handed to FmtMessage) and
          # must report it as a fault.
          foreach ($build in @(@{ Name = 'SlateOpsSelfTest'; Red = $false }, @{ Name = 'SlateOpsSelfTestRed'; Red = $true })) {
            $defines = @('/DAppVersion=0.0.0', '/DSelfTest')
            if ($build.Red) { $defines += '/DSelfTestRed' }
            & $iscc /Qp @defines ('/F' + $build.Name) SlateOpsSetup.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $result = Join-Path $env:RUNNER_TEMP ($build.Name + '.txt')
            $log = Join-Path $env:RUNNER_TEMP ($build.Name + '.log')
            $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/SELFTESTOUT="{0}"' -f $result), ('/LOG="{0}"' -f $log))
            $process = Start-Process -FilePath ('output\' + $build.Name + '.exe') -ArgumentList $arguments -Wait -PassThru
            Write-Host ('{0}: exit code {1}' -f $build.Name, $process.ExitCode)
            if (-not (Test-Path -LiteralPath $result)) {
              Get-Content -LiteralPath $log -ErrorAction SilentlyContinue
              throw ('{0} wrote no result file.' -f $build.Name)
            }
            $lines = @(Get-Content -LiteralPath $result)
            $lines | ForEach-Object { Write-Host $_ }
            if ($lines -notcontains 'DONE') { throw ('{0} did not finish.' -f $build.Name) }
            $failed = @($lines | Where-Object { $_ -like 'FAIL *' })
            if ($build.Red) {
              if (@($failed | Where-Object { $_ -like 'FAIL open-array*' }).Count -eq 0) { throw 'The open-array call did not fault: the W14-D1 cause is elsewhere.' }
              $failed = @($failed | Where-Object { $_ -notlike 'FAIL open-array*' })
            }
            if ($failed.Count -gt 0) { throw ('{0}: {1} step(s) failed.' -f $build.Name, $failed.Count) }
          }
      - name: Run the Windows-side script tests in Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File infra\windows\installer\tests\run-tests.ps1
          exit $LASTEXITCODE

  exec-path:
    # TASK-0097 W14-D8: the real job path of setup on a fresh runner. The helper creates the
    # account slateops-svc and the task \SlateOps\Exec as setup does, then wslconfig jobs go
    # through the task and are collected as the wizard collects them (exec-path.ps1). Its own
    # job, because it changes C:\ProgramData\SlateOps, which the self-test also uses.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run wslconfig jobs through the real account, Exec task and helper (W14-D8)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File infra\windows\installer\tests\exec-path.ps1
          exit $LASTEXITCODE

  mdns-spike:
    # DEC-0039 CI spike (TASK-0097): a limited account, run by a scheduled task as slateops-svc
    # is, registers a non-computer host name with DnsServiceRegister; then an own UDP 5353
    # responder next to Windows' responder (the fallback). Each check prints PASS, FAIL or
    # INCONCLUSIVE; a verdict never fails the job, only a spike that cannot run does.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Announce a host name from a limited account and run an own mDNS responder (DEC-0039 spike)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File infra\windows\installer\tests\mdns-spike.ps1
          exit $LASTEXITCODE
