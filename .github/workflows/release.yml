name: release

# Release artifacts for a version tag: docs/plans/windows-installer.md sections 5.1 to 5.3,
# slice W3. Later slices add the Linux image (W4), the engine bundle (W5b) and the
# installer (W7, W8). The release stays a draft.
#
# Re-run rule (parent decision D5, TASK-0079): never use "Re-run all jobs" or "Re-run
# failed jobs" on a failed run. A re-run pushes a new image digest under the same tag.
# Fix the cause and push a new tag with the next rc number. The release job fails when a
# release for the tag exists.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    # One step checks the tag (scripts/check_release_version.py rules, through
    # release_artifacts.py) and gives the validated version that every later job uses,
    # including the SLATEOPS_VERSION build argument. A stable tag needs LICENSE_WORK_MERGED
    # (a constant in scripts/release_artifacts.py, False until the license work) and a
    # commit on origin/main. A test-build tag needs a commit on a pushed branch. Every
    # other job waits for this one, so a refused tag pushes no image.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      title: ${{ steps.tag.outputs.title }}
      image_prefix: ${{ steps.tag.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history of every branch: origin/main and the pushed branches are present.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Check the tag, its version and its commit
        id: tag
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: >-
          python3 scripts/release_artifacts.py tag
          --tag "$TAG" --owner "$OWNER" --commit "$GITHUB_SHA" --main-ref origin/main
          --github-output "$GITHUB_OUTPUT"

  images:
    # One linux/amd64 image manifest per image, with OCI media types and no BuildKit
    # attestations, so the pushed digest is the one that the archive holds, cosign signs,
    # the attestation names and the manifest lists. No build cache: each release builds
    # every layer again from the tagged sources and the digest-pinned base images.
    # Test builds push to private GHCR packages; the setup payload uses the archives.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      server: ${{ steps.refs.outputs.server }}
      caddy: ${{ steps.refs.outputs.caddy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the server image
        id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          platforms: linux/amd64
          push: true
          outputs: type=image,oci-mediatypes=true
          provenance: false
          sbom: false
          no-cache: true
          build-args: |
            SLATEOPS_VERSION=${{ needs.check.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          tags: ${{ needs.check.outputs.image_prefix }}/slateops-server:${{ needs.check.outputs.version }}
      - name: Build and push the Caddy image
        id: caddy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/caddy.Dockerfile
          platforms: linux/amd64
          push: true
          outputs: type=image,oci-mediatypes=true
          provenance: false
          sbom: false
          no-cache: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          tags: ${{ needs.check.outputs.image_prefix }}/slateops-caddy:${{ needs.check.outputs.version }}
      - name: Record the image references by digest
        id: refs
        env:
          PREFIX: ${{ needs.check.outputs.image_prefix }}
          VERSION: ${{ needs.check.outputs.version }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          CADDY_DIGEST: ${{ steps.caddy.outputs.digest }}
        run: |
          echo "server=$PREFIX/slateops-server:$VERSION@$SERVER_DIGEST" >> "$GITHUB_OUTPUT"
          echo "caddy=$PREFIX/slateops-caddy:$VERSION@$CADDY_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Write and check the image archives (before any signature)
        # skopeo copies the pushed digest byte for byte (--preserve-digests fails instead of
        # converting); image-info then checks every blob against the pushed digest.
        env:
          SERVER: ${{ steps.refs.outputs.server }}
          CADDY: ${{ steps.refs.outputs.caddy }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p archives image-info
          echo "### Image sizes (W3-6)" >> "$GITHUB_STEP_SUMMARY"
          for pair in "server:$SERVER" "caddy:$CADDY"; do
            role="${pair%%:*}"
            reference="${pair#*:}"
            archive="archives/slateops-$role-$VERSION-amd64.oci.tar"
            skopeo copy --preserve-digests --src-authfile "$HOME/.docker/config.json" \
              "docker://$reference" "oci-archive:$archive:${reference%@*}"
            python3 scripts/release_artifacts.py image-info --reference "$reference" \
              --archive "$archive" --output "image-info/$role.json" --summary "$GITHUB_STEP_SUMMARY"
          done
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign the image digests (keyless, GitHub OIDC)
        env:
          SERVER: ${{ steps.refs.outputs.server }}
          CADDY: ${{ steps.refs.outputs.caddy }}
        run: |
          cosign sign --yes "$SERVER"
          cosign sign --yes "$CADDY"
      - name: Attest the server image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.check.outputs.image_prefix }}/slateops-server
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true
          # Storage records need artifact-metadata: write and an organization-owned repository.
          create-storage-record: false
      - name: Attest the Caddy image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.check.outputs.image_prefix }}/slateops-caddy
          subject-digest: ${{ steps.caddy.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-images
          path: archives/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-info
          path: image-info/
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: [check, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-info
          path: image-info
      - name: Write the release manifest and the release notes
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          SERVER_IMAGE: ${{ needs.images.outputs.server }}
          CADDY_IMAGE: ${{ needs.images.outputs.caddy }}
        run: |
          python3 scripts/release_artifacts.py manifest \
            --version "$VERSION" \
            --server-info image-info/server.json --caddy-info image-info/caddy.json \
            --compose infra/supabase/compose.yaml --output dist/release-manifest.json
          python3 scripts/release_artifacts.py notes \
            --tag "$TAG" --prerelease "$PRERELEASE" \
            --identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" --repository "$GITHUB_REPOSITORY" \
            --server-image "$SERVER_IMAGE" --caddy-image "$CADDY_IMAGE" \
            --output notes/release-notes.md
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign the release manifest (keyless, GitHub OIDC)
        run: cosign sign-blob --yes --bundle dist/release-manifest.json.sigstore.json dist/release-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-manifest
          path: dist/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/release-notes.md
          if-no-files-found: error
          retention-days: 1

  notices:
    # License data comes from what the release ships: the locked Python packages without
    # development packages (as in the server image), the npm production packages
    # (installed without running their install scripts), and the Debian and Alpine
    # package databases copied out of the pushed images with docker create and docker cp,
    # so no code from an image runs here. packages: read pulls the images while the
    # GHCR packages are private.
    needs: [check, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The uv of the server image (infra/docker/backend.Dockerfile); bump both together.
          version: "0.12.13"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Copy the package databases out of the pushed images
        env:
          SERVER_IMAGE: ${{ needs.images.outputs.server }}
          CADDY_IMAGE: ${{ needs.images.outputs.caddy }}
        run: |
          echo "### Unpacked image sizes (W3-6)" >> "$GITHUB_STEP_SUMMARY"
          extract() {
            local name="$1" image="$2" container path
            shift 2
            docker pull --quiet "$image"
            echo "- $name (unpacked): $(docker image inspect --format '{{.Size}}' "$image") bytes" \
              >> "$GITHUB_STEP_SUMMARY"
            container="$(docker create "$image")"
            for path in "$@"; do
              mkdir -p "image-files/$name$(dirname "$path")"
              docker cp "$container:$path" "image-files/$name$path"
            done
            docker rm "$container"
          }
          extract server "$SERVER_IMAGE" /var/lib/dpkg/status /usr/share/doc
          extract caddy "$CADDY_IMAGE" /lib/apk/db/installed
      - name: Install the Python packages that the server image ships
        working-directory: backend
        # The same lock flag as the image (infra/docker/backend.Dockerfile).
        run: uv sync --frozen --no-dev --no-install-project
      - name: Install the npm production packages
        working-directory: frontend
        run: npm ci --omit=dev --ignore-scripts
      - name: Write the third-party notices
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          site_packages="$(backend/.venv/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          python3 scripts/release_artifacts.py notices \
            --version "$VERSION" --python-site-packages "$site_packages" --npm-root frontend \
            --server-files image-files/server --caddy-files image-files/caddy \
            --compose infra/supabase/compose.yaml --output dist/THIRD-PARTY-NOTICES.txt \
            --source-offer dist/SOURCE-OFFER.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-notices
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    # The only job that writes to the repository. It checks out nothing and runs no
    # repository code; it downloads the assets, writes SHA256SUMS and creates the draft.
    needs: [check, images, manifest, notices]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Refuse a tag that already has a release (re-run rule)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tags="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')"
          if printf '%s\n' "$tags" | grep -Fxq -- "$TAG"; then
            echo "::error::A release for $TAG exists. Do not re-run; push the next rc number."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Write SHA256SUMS for every asset
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f -printf '%P\n' \
            | LC_ALL=C sort | xargs -d '\n' sha256sum -- > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ needs.check.outputs.title }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --title "$TITLE" --notes-file notes/release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" dist/*
          cat notes/release-notes.md >> "$GITHUB_STEP_SUMMARY"
